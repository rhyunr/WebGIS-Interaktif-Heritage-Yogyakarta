<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebGIS Heritage Yogyakarta</title>

<!-- LEAFLET CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- STYLE -->
<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- HEADER -->

<div id="header">

  <div class="logo-area">
    <div class="logo-icon">🏯</div>

    <h1>
      Heritage Yogyakarta
      <span>WEBGIS HERITAGE INTERAKTIF</span>
    </h1>
  </div>

</div>

<!-- MAIN -->

<div id="main-container">

  <!-- SIDEBAR -->

  <div id="sidebar">

    <div id="sidebar-header">
      <h2>📍 Bangunan Heritage</h2>
    </div>

    <div id="building-list"></div>

    <div id="info-panel">

      <div class="info-placeholder">
        Klik bangunan untuk melihat detail.
      </div>

    </div>

  </div>

  <!-- MAP -->

  <div id="map-container">

    <div id="map"></div>

  </div>

</div>

<!-- STATUSBAR -->

<div id="statusbar">
WebGIS Heritage Yogyakarta
</div>

<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- APP -->

<script src="./app.js"></script>

</body>
</html>
